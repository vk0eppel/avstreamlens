name: Release

# v1 distribution targets: macOS (arm64 + x86_64), Linux x86_64, Windows x86_64.
# Explicit non-goals for now (future work, not built here):
#   - aarch64-unknown-linux-gnu
#   - aarch64-pc-windows-msvc
#   - a macOS universal/lipo binary combining both Darwin artifacts
# Binaries are unsigned in v1 — see README.md for the Gatekeeper/SmartScreen
# bypass instructions this implies for end users.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  # Keep in sync with .github/workflows/ci.yml — see the comment there for why
  # this is pinned + checksummed rather than always fetching "latest".
  NPCAP_SDK_VERSION: "1.16"
  NPCAP_SDK_SHA256: "f0a8be7778ee3ae1b99bbbecb27a3ff0f6c111a4093f1c78c5c5a099607184db"
  # The Linux release binary statically links libpcap so it has NO runtime
  # dependency on a system libpcap (Fedora Atomic / Bazzite and other non-
  # Debian distros don't ship it). Ubuntu's libpcap-dev only provides a shared
  # .so, and the `pcap` crate links dynamically by default, so we build a
  # static libpcap.a from source here. Pinned + checksummed like the Npcap SDK.
  # Bump both together; checksum is `sha256sum libpcap-<ver>.tar.xz` from
  # https://www.tcpdump.org/release/.
  LIBPCAP_VERSION: "1.10.5"
  LIBPCAP_SHA256: "84fa89ac6d303028c1c5b754abff77224f45eca0a94eb1a34ff0aa9ceece3925"

jobs:
  verify-version:
    name: verify tag matches Cargo.toml version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag to Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "Tag matches Cargo.toml version: $cargo_version"

  build:
    name: build (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-2022

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build static libpcap (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # flex/bison build libpcap's BPF filter compiler; gcc + make already
          # present on the runner. We deliberately do NOT install libpcap-dev —
          # a system libpcap.so in the link path could be picked up instead of
          # our static archive.
          sudo apt-get install -y --no-install-recommends flex bison
          url="https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.xz"
          curl -fsSL -o libpcap.tar.xz "$url"
          echo "${LIBPCAP_SHA256}  libpcap.tar.xz" | sha256sum -c -
          tar xf libpcap.tar.xz
          cd "libpcap-${LIBPCAP_VERSION}"
          # --disable-shared → only libpcap.a is produced, so the linker has no
          # .so to prefer. Disable the optional backends so the static archive
          # doesn't drag in libdbus/libnl/libibverbs/etc. transitive .so deps.
          ./configure --prefix="$HOME/libpcap-static" \
            --disable-shared --disable-dbus --disable-rdma \
            --disable-bluetooth --disable-usb --without-libnl
          make -j"$(nproc)"
          make install
          # Point the `pcap` crate's build.rs at the dir holding only libpcap.a.
          # With LIBPCAP_LIBDIR set it skips pkg-config, adds this dir to the
          # link search path, and `-lpcap` resolves to the static archive.
          echo "LIBPCAP_LIBDIR=$HOME/libpcap-static/lib" >> "$GITHUB_ENV"
          echo "LIBPCAP_VER=${LIBPCAP_VERSION}" >> "$GITHUB_ENV"

      # macOS runners already ship libpcap headers via the Xcode Command
      # Line Tools SDK — no install step needed, for either Darwin target.

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://npcap.com/dist/npcap-sdk-$env:NPCAP_SDK_VERSION.zip"
          $zip = "$env:RUNNER_TEMP\npcap-sdk.zip"
          $sdkDir = "$env:RUNNER_TEMP\npcap-sdk"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:NPCAP_SDK_SHA256) {
            Write-Error "Npcap SDK checksum mismatch: expected $env:NPCAP_SDK_SHA256, got $hash"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath $sdkDir
          echo "LIB=$env:LIB;$sdkDir\Lib\x64" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify no dynamic libpcap dependency (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/avstreamlens"
          if ldd "$bin" | grep -qi pcap; then
            echo "::error::Release binary still dynamically links libpcap — static link failed:"
            ldd "$bin" | grep -i pcap
            exit 1
          fi
          echo "OK: libpcap is statically linked (no libpcap.so dependency)"
          ldd "$bin" || true

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="avstreamlens-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/avstreamlens" "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ARCHIVE_NAME=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "avstreamlens-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\avstreamlens.exe" $name
          Copy-Item README.md,LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          echo "ARCHIVE_NAME=$name.zip" >> $env:GITHUB_ENV

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ARCHIVE_NAME }}
